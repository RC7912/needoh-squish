<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NeeDoh Squish</title>
<meta name="description" content="A relaxing ASMR squishy toy game: squish a NeeDoh, pop a Pop It and bubble wrap, stir Orbeez, slice kinetic sand, stretch slime, spin a fidget spinner, click keys, press squishy butter and squeeze a dumpling. Lo-fi chill mode included. Best with headphones.">
<meta name="theme-color" content="#f3e8f7">
<meta property="og:title" content="NeeDoh Squish">
<meta property="og:description" content="Relaxing ASMR squishy toys in your browser. Headphones recommended.">
<link rel="icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root {
    --bg1: #fde8f1;
    --bg2: #e6e9ff;
    --ink: #5b4a6b;
    --chip: rgba(255,255,255,.65);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(circle at 30% 20%, var(--bg1), var(--bg2));
    font-family: "Ubuntu", "Nunito", system-ui, sans-serif;
    color: var(--ink);
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
  canvas.grabbing { cursor: grabbing; }
  canvas.poke { cursor: pointer; }
  .hud {
    position: fixed; top: 16px; left: 16px; right: 16px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none;
  }
  .title { font-weight: 700; font-size: 22px; letter-spacing: .5px; opacity: .85; }
  .sub { font-size: 13px; opacity: .6; margin-top: 2px; }
  .count { font-size: 14px; background: var(--chip); padding: 6px 12px; border-radius: 999px; backdrop-filter: blur(6px); }
  .toys {
    position: fixed; top: 74px; left: 0; right: 0; margin: 0 auto; width: max-content; max-width: calc(100vw - 16px);
    display: flex; gap: 6px; background: var(--chip); padding: 6px; border-radius: 999px;
    backdrop-filter: blur(8px); box-shadow: 0 6px 24px rgba(90,60,120,.12);
  }
  .toys button {
    border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 14px;
    padding: 7px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  }
  .toys button:hover { background: rgba(255,255,255,.7); }
  .toys { overflow-x: auto; scrollbar-width: none; }
  .toys::-webkit-scrollbar { display: none; }
  .toys button.on { background: var(--ink); color: white; }
  .bar {
    position: fixed; bottom: 18px; left: 0; right: 0; margin: 0 auto; width: fit-content;
    display: flex; gap: 10px; align-items: center;
    background: var(--chip); padding: 10px 14px; border-radius: 999px;
    backdrop-filter: blur(8px); box-shadow: 0 6px 24px rgba(90,60,120,.12);
    max-width: calc(100vw - 32px); flex-wrap: wrap; justify-content: center;
  }
  .opts { display: contents; }
  .opts[hidden] { display: none; }
  .swatch {
    width: 30px; height: 30px; border-radius: 50%; border: 3px solid white;
    cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.15); transition: transform .15s;
  }
  .swatch:hover { transform: scale(1.12); }
  .swatch.on { outline: 3px solid var(--ink); outline-offset: 1px; }
  .sep { width: 1px; height: 24px; background: rgba(0,0,0,.12); }
  .colpick {
    position: relative; width: 32px; height: 32px; border-radius: 50%; border: 3px solid white; cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,.15); display: grid; place-items: center; font-size: 13px; overflow: hidden;
  }
  .colpick input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: 0; padding: 0; }
  .colpick span { pointer-events: none; filter: drop-shadow(0 1px 1px rgba(0,0,0,.25)); }
  button.tog {
    border: 0; background: white; color: var(--ink); font: inherit; font-size: 13px;
    padding: 7px 12px; border-radius: 999px; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.08);
  }
  button.tog.on { background: var(--ink); color: white; }
  .hint {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, 190px);
    font-size: 15px; opacity: .55; pointer-events: none; transition: opacity 1s; white-space: nowrap;
  }
  .right { display: flex; gap: 8px; align-items: center; pointer-events: auto; }
  .chip-btn { cursor: pointer; border: 0; font: inherit; color: inherit; }
  .chip-btn:hover { background: rgba(255,255,255,.9); }
  .toys .e { font-size: 16px; }
  .toys .nm { margin-left: 5px; }

  /* night mode */
  body.night { --ink: #ece6ff; --chip: rgba(28,24,58,.62); }
  body.night button.tog { background: rgba(255,255,255,.1); color: var(--ink); box-shadow: none; }
  body.night button.tog.on { background: var(--ink); color: #1d1840; }
  body.night .toys button.on { color: #1d1840; }
  body.night .toys button:hover, body.night .chip-btn:hover { background: rgba(255,255,255,.14); }
  body.night .swatch { border-color: rgba(255,255,255,.7); }
  body.night .sep { background: rgba(255,255,255,.18); }

  /* achievement toasts */
  .toasts { position: fixed; top: 128px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; z-index: 5; }
  .toast {
    display: flex; gap: 10px; align-items: center; padding: 10px 16px 10px 12px; border-radius: 16px;
    background: linear-gradient(135deg, #fff, #f6efff); color: #4b3a63; box-shadow: 0 10px 30px rgba(90,60,130,.25);
    animation: toastIn .5s cubic-bezier(.2,1.6,.4,1), toastOut .5s ease-in 2.8s forwards;
  }
  .toast .big { font-size: 28px; }
  .toast b { display: block; font-size: 14px; }
  .toast small { font-size: 12px; opacity: .7; }
  @keyframes toastIn { from { transform: translateY(-30px) scale(.8); opacity: 0; } }
  @keyframes toastOut { to { transform: translateY(-20px); opacity: 0; } }

  /* achievements panel */
  .panel-wrap { position: fixed; inset: 0; background: rgba(40,25,70,.35); backdrop-filter: blur(4px); display: grid; place-items: center; z-index: 10; padding: 16px; }
  .panel-wrap[hidden] { display: none; }
  .panel {
    width: min(460px, 100%); max-height: min(80vh, 640px); overflow: auto; background: #fff; color: #4b3a63;
    border-radius: 22px; padding: 18px 18px 8px; box-shadow: 0 20px 60px rgba(40,20,80,.35);
  }
  .panel h2 { margin: 0 0 4px; font-size: 20px; display: flex; justify-content: space-between; align-items: center; }
  .panel h2 button { border: 0; background: #f2ecfa; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; font-size: 16px; color: inherit; }
  .panel .meta { font-size: 13px; opacity: .65; margin-bottom: 12px; }
  .ach { display: flex; gap: 12px; align-items: center; padding: 10px 6px; border-top: 1px solid #f1ebf8; }
  .ach .big { font-size: 26px; width: 34px; text-align: center; }
  .ach b { display: block; font-size: 14px; }
  .ach small { font-size: 12px; opacity: .65; }
  .ach.locked .big { filter: grayscale(1); opacity: .35; }
  .ach.locked b { opacity: .5; }

  @media (max-width: 1280px) {
    .toys button:not(.on) .nm { display: none; }
    .toys button { padding: 7px 11px; }
  }
  @media (max-width: 560px) {
    .toys .nm { display: none; }
    .toys { gap: 0; padding: 5px; }
    .toys button { padding: 6px 6px; }
    .toys .e { font-size: 15px; }
  }
  @media (max-width: 560px) {
    .toys { top: 70px; }
    .bar { gap: 6px; padding: 8px 10px; bottom: 10px; }
    button.tog { padding: 6px 9px; font-size: 12px; }
    .swatch { width: 26px; height: 26px; }
    .title { font-size: 18px; }
    .sub { display: none; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div>
    <div class="title" id="title">NeeDoh Squish</div>
    <div class="sub" id="sub"></div>
  </div>
  <div class="right">
    <div class="count" id="count">0 squishes</div>
    <button class="count chip-btn" id="trophyBtn" title="Achievements">🏆 0</button>
  </div>
</div>
<div class="toasts" id="toasts"></div>
<div class="panel-wrap" id="panel" hidden>
  <div class="panel" role="dialog" aria-label="Achievements">
    <h2>🏆 Achievements <button id="panelClose" aria-label="Close">✕</button></h2>
    <div class="meta" id="panelMeta"></div>
    <div id="achList"></div>
  </div>
</div>
<div class="toys" id="toys"></div>
<div class="hint" id="hint">🎧 headphones recommended</div>
<div class="bar" id="bar">
  <div class="opts" id="opt-needoh">
    <button class="tog on" id="texBtn" title="Surface texture">Glitter</button>
    <div class="sep"></div>
    <span class="opts" id="swatches"></span>
    <div class="sep"></div>
  </div>
  <div class="opts" id="opt-popit" hidden>
    <button class="tog" id="flipBtn">🔄 Flip</button>
    <button class="tog" id="shapeBtn">Square</button>
    <div class="sep"></div>
  </div>
  <div class="opts" id="opt-orbeez" hidden>
    <button class="tog" id="shakeBtn">🫨 Shake</button>
    <button class="tog" id="orbColBtn">Rainbow</button>
    <div class="sep"></div>
  </div>
  <div class="opts" id="opt-wrap" hidden>
    <button class="tog" id="sheetBtn">📦 New sheet</button>
    <div class="sep"></div>
  </div>
  <div class="opts" id="opt-butter" hidden>
    <button class="tog" id="honeyBtn" title="Honey mode: press to pour">🍯 Honey</button>
    <button class="tog" id="cleanBtn" title="Wipe the honey off">🧽</button>
    <label class="colpick" title="Butter colour"><input type="color" id="butterColIn"><span>🧈</span></label>
    <label class="colpick" title="Honey colour"><input type="color" id="honeyColIn"><span>🍯</span></label>
    <div class="sep"></div>
  </div>
  <div class="opts" id="opt-slime" hidden>
    <button class="tog" id="slimeColBtn">Jelly</button>
    <div class="sep"></div>
  </div>
  <div class="opts" id="opt-sand" hidden>
    <button class="tog" id="newBlockBtn">🧱 New block</button>
    <button class="tog" id="sandColBtn">Lilac</button>
    <div class="sep"></div>
  </div>
  <div class="opts" id="opt-spinner" hidden>
    <button class="tog" id="spinStyleBtn">Rainbow</button>
    <div class="sep"></div>
  </div>
  <button class="tog" id="musicBtn" title="Lo-fi music (M)">🎵 Chill</button>
  <button class="tog" id="rainBtn" title="Rain (R)">🌧</button>
  <button class="tog" id="nightBtn" title="Night mode (N)">🌙</button>
  <button class="tog on" id="sndBtn">🔊</button>
</div>

<script>
(() => {
'use strict';

// ---------- setup ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const baseRadius = () => Math.min(W, H) * 0.2;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mix(h, h2, t, a = 1) {
  const x = hexRgb(h), y = hexRgb(h2);
  return `rgba(${x.map((v, i) => Math.round(v + (y[i] - v) * t)).join(',')},${a})`;
}

// ---------- audio ----------
// Everything is synthesized live. Sounds are panned toward where you touch (wear headphones)
// and sent through a small generated room so they feel close rather than dry.
let AC = null, master, wetSend, NOISE, soundOn = true;
let bedGain, bedLP, bedBP, bedPan, grainAcc = 0;
const rnd = (a, b) => a + Math.random() * (b - a);
const touchPan = () => (W ? clamp((pointer.x / W) * 2 - 1, -1, 1) * 0.75 : 0);

function initAudio(offline) {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  AC = offline || new (window.AudioContext || window.webkitAudioContext)();
  // soft-clip limiter: transparent at normal levels, rounds off only the loudest peaks
  const clip = AC.createWaveShaper(), curve = new Float32Array(2048);
  for (let i = 0; i < curve.length; i++) {
    const x = (i / (curve.length - 1)) * 2 - 1, ax = Math.abs(x);
    curve[i] = ax < 0.6 ? x : Math.sign(x) * (0.6 + 0.4 * Math.tanh((ax - 0.6) / 0.4));
  }
  clip.curve = curve; clip.oversample = '2x';
  master = AC.createGain(); master.gain.value = 1;
  master.connect(clip); clip.connect(AC.destination);

  // small, soft, dark room
  const len = Math.floor(AC.sampleRate * 1.1), ir = AC.createBuffer(2, len, AC.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch);
    let lp = 0;
    for (let i = 0; i < len; i++) {
      lp += 0.3 * ((Math.random() * 2 - 1) - lp);
      d[i] = i < AC.sampleRate * 0.006 ? 0 : lp * Math.pow(1 - i / len, 3.5);
    }
  }
  const verb = AC.createConvolver(); verb.buffer = ir;
  wetSend = AC.createGain(); wetSend.gain.value = 0.35;
  wetSend.connect(verb); verb.connect(master);

  // one shared noise buffer, played from random offsets
  NOISE = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
  const nd = NOISE.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

  // continuous bed for the squishy toys: soft muffled rustle + a hollow suction band
  const src = AC.createBufferSource(); src.buffer = NOISE; src.loop = true;
  bedLP = AC.createBiquadFilter(); bedLP.type = 'lowpass'; bedLP.frequency.value = 700; bedLP.Q.value = 0.8;
  bedBP = AC.createBiquadFilter(); bedBP.type = 'bandpass'; bedBP.frequency.value = 300; bedBP.Q.value = 5;
  const bpGain = AC.createGain(); bpGain.gain.value = 2.2;
  bedGain = AC.createGain(); bedGain.gain.value = 0;
  src.connect(bedLP); bedLP.connect(bedGain);
  src.connect(bedBP); bedBP.connect(bpGain); bpGain.connect(bedGain);
  bedPan = AC.createStereoPanner();
  bedGain.connect(bedPan); bedPan.connect(master);
  const bedWet = AC.createGain(); bedWet.gain.value = 0.5; bedPan.connect(bedWet); bedWet.connect(wetSend);
  src.start();
}

function out(pan, wet = 1) {
  const p = AC.createStereoPanner();
  p.pan.value = clamp(pan ?? touchPan(), -1, 1);
  p.connect(master);
  if (wet) { const s = AC.createGain(); s.gain.value = wet; p.connect(s); s.connect(wetSend); }
  return p;
}
function env(t, dur, vol, attack) {
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(vol, 0.0002), t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  return g;
}
const live = () => AC && soundOn;
function noise(dur, { type = 'bandpass', f0, f1 = f0, q = 1, vol, attack = 0.005, delay = 0, pan, wet = 1 }) {
  if (!live()) return;
  const t = AC.currentTime + delay;
  const s = AC.createBufferSource(); s.buffer = NOISE;
  const f = AC.createBiquadFilter(); f.type = type; f.Q.value = q;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = env(t, dur, vol, attack);
  s.connect(f); f.connect(g); g.connect(out(pan, wet));
  s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05);
}
function tone(dur, f0, f1, vol, { type = 'sine', attack = 0.004, delay = 0, pan, wet = 1 } = {}) {
  if (!live()) return;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = env(t, dur, vol, attack);
  o.connect(g); g.connect(out(pan, wet)); o.start(t); o.stop(t + dur + 0.05);
}
// A collapsing air bubble rings with a pitch that rises: the core of every wet "squish"
function bubble(f, vol, { delay = 0, pan, dur = rnd(0.015, 0.045), rise = rnd(1.4, 2.6) } = {}) {
  tone(dur, f, f * rise, vol, { attack: 0.0015, delay, pan, wet: 0.6 });
}
function bubbles(n, lo, hi, vol, spread, pan) {
  for (let i = 0; i < n; i++) bubble(rnd(lo, hi), vol * rnd(0.4, 1), { delay: rnd(0, spread), pan: (pan ?? touchPan()) + rnd(-0.15, 0.15) });
}

// Drives the continuous squish from how fast the toy is moving
function squishAudio(p, energy, stretch, squeeze, dt, held) {
  if (!AC) return;
  const t = AC.currentTime;
  if (!soundOn) { bedGain.gain.setTargetAtTime(0, t, 0.03); return; }
  const motion = clamp(energy / 160, 0, 1.5);
  const act = Math.max(0, held ? motion + squeeze * 0.12 : motion * 0.35) || 0;
  // jitter so the bed breathes instead of hissing steadily
  bedGain.gain.setTargetAtTime(Math.min(0.7, act ** 1.3 * p.bed) * rnd(0.5, 1.2), t, 0.02);
  const s = clamp(stretch * 2 + squeeze * 0.3, 0, 1) || 0;
  bedLP.frequency.setTargetAtTime(p.lp[0] + (p.lp[1] - p.lp[0]) * s, t, 0.05);
  bedBP.frequency.setTargetAtTime((p.bp[0] + (p.bp[1] - p.bp[0]) * s) * rnd(0.85, 1.15), t, 0.03);
  bedPan.pan.setTargetAtTime(touchPan(), t, 0.05);
  grainAcc += dt * p.grains * Math.min(1.5, act);
  while (grainAcc > 1) {
    grainAcc -= 1;
    bubble(rnd(p.bf[0], p.bf[1]) * (1 + stretch * 0.6), p.bvol * rnd(0.3, 1) * Math.min(1, act + 0.3),
      { delay: rnd(0, 0.02), pan: touchPan() + rnd(-0.2, 0.2) });
  }
}
function silenceBed() { if (AC) bedGain.gain.setTargetAtTime(0, AC.currentTime, 0.05); }

const sfx = {
  // NeeDoh: gel suction squelch
  grab() {
    noise(0.24, { type: 'lowpass', f0: 1800, f1: 260, q: 2, vol: 0.7, attack: 0.012 });
    tone(0.14, 120, 60, 0.54, { wet: 0.3 });
    bubbles(5, 350, 900, 0.324, 0.12);
  },
  // wet release "bloop" + settling bubbles
  plop(big) {
    tone(0.07, 320, 1050, 0.476, { attack: 0.003 });
    tone(0.12, 95, 60, 0.35, { wet: 0.3 });
    noise(0.05, { type: 'bandpass', f0: 1800, f1: 900, q: 1.5, vol: 0.168 });
    bubbles(big ? 7 : 4, 500, 1400, 0.168, 0.25);
  },
  crackle() { bubble(rnd(1400, 3200), rnd(0.05, 0.12), { dur: rnd(0.008, 0.02), pan: touchPan() + rnd(-0.3, 0.3) }); },
  sugar() {
    const n = 1 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++)
      noise(rnd(0.006, 0.018), { type: 'highpass', f0: rnd(3000, 6000), q: 0.7, vol: rnd(0.092, 0.23), attack: 0.001, delay: i * rnd(0.008, 0.025), wet: 0.4 });
  },
  // Butter: deep soft "fwumpf" as air leaves the foam
  butterPress() {
    noise(0.5, { type: 'lowpass', f0: 900, f1: 140, q: 1, vol: 0.81, attack: 0.03 });
    tone(0.3, 85, 48, 0.504, { attack: 0.02, wet: 0.3 });
    noise(0.7, { type: 'bandpass', f0: 700, f1: 400, q: 0.8, vol: 0.108, attack: 0.15 });
  },
  butterDrag() { noise(0.25, { type: 'lowpass', f0: 500, f1: 180, q: 1, vol: 0.72, attack: 0.03 }); },
  // slow inhale as the foam refills
  butterSigh() {
    noise(1.2, { type: 'lowpass', f0: 250, f1: 650, q: 0.8, vol: 0.28, attack: 0.35 });
    bubbles(2, 180, 320, 0.168, 0.6);
  },
  foam() {
    noise(rnd(0.003, 0.009), { type: 'highpass', f0: rnd(4000, 8000), q: 0.7, vol: rnd(0.03, 0.1), attack: 0.001, wet: 0.5, pan: rnd(-0.5, 0.5) });
  },
  // Honey: a thick gloop as it starts to pour, soft blips as it lands, sticky crackle when squished
  gloop() {
    bubble(rnd(170, 240), 0.32, { rise: 1.7, dur: 0.09 });
    noise(0.16, { type: 'lowpass', f0: 500, f1: 250, q: 1.5, vol: 0.18, attack: 0.01 });
  },
  honeyBlip() { bubble(rnd(140, 320), rnd(0.06, 0.13), { dur: rnd(0.04, 0.07), rise: rnd(1.2, 1.5) }); },
  // honey on the butter cracks like a hard candy shell when you press it
  honeyCrack(pan) {
    if (!live()) return;
    const v = rnd(0.85, 1.1), p = pan ?? touchPan();
    noise(0.006, { type: 'highpass', f0: 3000, q: 0.7, vol: 0.9 * v, attack: 0.0004, pan: p, wet: 0.5 });          // the snap
    noise(0.03, { type: 'bandpass', f0: rnd(1800, 2600), f1: 900, q: 1.2, vol: 0.7 * v, attack: 0.0006, pan: p, wet: 0.5 });
    tone(0.05, rnd(2600, 3400), 2000, 0.12, { attack: 0.001, pan: p });                                             // glassy ring
    tone(0.06, 160, 80, 0.3, { attack: 0.002, pan: p, wet: 0.3 });                                                  // thump
    for (let i = 0; i < 9; i++)                                                                                    // shell breaking up
      noise(rnd(0.003, 0.009), { type: 'bandpass', f0: rnd(1500, 5000), q: 1.5, vol: rnd(0.15, 0.45) * v, attack: 0.0005,
        delay: 0.015 + i * rnd(0.012, 0.035), pan: p + rnd(-0.2, 0.2), wet: 0.4 });
  },
  honeyCrackle() {
    noise(rnd(0.003, 0.008), { type: 'bandpass', f0: rnd(1500, 4500), q: 1.5, vol: rnd(0.25, 0.65), attack: 0.0005, pan: touchPan() + rnd(-0.2, 0.2), wet: 0.4 });
  },
  sticky() {

// ---------- chill mode: generated lo-fi music + rain ----------
const music = { on: false, rain: false, step: 0, next: 0, timer: null };
let mOut, mBus, mDrum, rainGain;
const PROG = [[53, 57, 60, 64, 67], [52, 55, 59, 62, 67], [50, 53, 57, 60, 64], [48, 52, 55, 59, 62]]; // Fmaj9 Em7 Dm9 Cmaj9
const ROOTS = [41, 40, 38, 36];
const KEYS = [72, 74, 76, 79, 81, 84];
const BPM = 72, EIGHTH = 60 / BPM / 2;

function ensureMusic() {
  if (mOut) return;
  mOut = AC.createGain(); mOut.gain.value = 0;
  mOut.connect(master);
  const send = AC.createGain(); send.gain.value = 0.5; mOut.connect(send); send.connect(wetSend);
  // pads, bass and keys go through a warm, slowly breathing lowpass
  mBus = AC.createGain();
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1500; lp.Q.value = 0.6;
  const lfo = AC.createOscillator(), depth = AC.createGain();
  lfo.frequency.value = 0.06; depth.gain.value = 450;
  lfo.connect(depth); depth.connect(lp.frequency); lfo.start();
  mBus.connect(lp); lp.connect(mOut);
  mDrum = AC.createGain(); mDrum.connect(mOut);
}
function mNote(time, dur, f, vol, { type = 'triangle', attack = 0.4, release = 1, dest = mBus } = {}) {
  const o = AC.createOscillator(); o.type = type; o.frequency.value = f;
  const g = AC.createGain();
  g.gain.setValueAtTime(0, time);
  g.gain.linearRampToValueAtTime(vol, time + attack);
  g.gain.setValueAtTime(vol, time + Math.max(attack, dur));
  g.gain.linearRampToValueAtTime(0, time + Math.max(attack, dur) + release);
  o.connect(g); g.connect(dest);
  o.start(time); o.stop(time + Math.max(attack, dur) + release + 0.05);
}
function mNoise(time, dur, type, f, q, vol) {
  const s = AC.createBufferSource(); s.buffer = NOISE;
  const fl = AC.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, time); g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
  s.connect(fl); fl.connect(g); g.connect(mDrum);
  s.start(time, Math.random() * 1.5); s.stop(time + dur + 0.02);
}
function scheduleStep(step, time) {
  const bar = Math.floor(step / 8) % PROG.length, e = step % 8;
  const swing = e % 2 ? EIGHTH * 0.16 : 0;
  const t = time + swing;
  if (e === 0) {
    const barDur = EIGHTH * 8;
    for (const n of PROG[bar]) for (const det of [0.997, 1.003]) mNote(t, barDur - 0.3, mtof(n) * det, 0.03, { attack: 0.9, release: 1.6 });
    mNote(t, EIGHTH * 3, mtof(ROOTS[bar]), 0.2, { type: 'sine', attack: 0.02, release: 0.4 });
  }
  if (e === 5) mNote(t, EIGHTH * 2, mtof(ROOTS[bar]), 0.14, { type: 'sine', attack: 0.02, release: 0.3 });
  // soft kick
  if (e === 0 || e === 5) {
    const o = AC.createOscillator(), g = AC.createGain();
    o.frequency.setValueAtTime(115, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.14);
    g.gain.setValueAtTime(0.45, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    o.connect(g); g.connect(mDrum); o.start(t); o.stop(t + 0.32);
  }
  if (e === 2 || e === 6) { mNoise(t, 0.16, 'bandpass', 1900, 0.8, 0.13); mNoise(t, 0.05, 'lowpass', 400, 1, 0.12); } // brushy snare
  mNoise(t, e % 2 ? 0.025 : 0.04, 'highpass', 7000, 0.7, e % 2 ? 0.025 : 0.045);   // hats
  // kalimba noodles
  if (Math.random() < (e % 2 ? 0.18 : 0.32)) {
    const f = mtof(KEYS[Math.floor(Math.random() * KEYS.length)]);
    mNote(t, 0.01, f, 0.07, { type: 'sine', attack: 0.004, release: 1.1, dest: mDrum });
    mNote(t, 0.01, f * 5.4, 0.008, { type: 'sine', attack: 0.002, release: 0.12, dest: mDrum });
  }
  // vinyl crackle
  for (let i = Math.floor(Math.random() * 3); i > 0; i--) mNoise(t + rnd(0, EIGHTH), 0.003, 'highpass', 3000, 0.5, rnd(0.01, 0.04));
}
function setMusic(on) {
  initAudio(); ensureMusic();
  music.on = on;
  const now = AC.currentTime;
  mOut.gain.cancelScheduledValues(now);
  mOut.gain.setValueAtTime(mOut.gain.value, now);
  mOut.gain.linearRampToValueAtTime(on ? 0.45 : 0, now + (on ? 2 : 1));
  clearInterval(music.timer);
  if (on) {
    music.next = now + 0.1; music.step = 0;
    music.timer = setInterval(() => {
      while (music.next < AC.currentTime + 0.3) { scheduleStep(music.step++, music.next); music.next += EIGHTH; }
    }, 60);
  }
}
function setRain(on) {
  initAudio();
  music.rain = on;
  if (!rainGain) {
    const src = AC.createBufferSource(); src.buffer = NOISE; src.loop = true;
    const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 500;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200;
    rainGain = AC.createGain(); rainGain.gain.value = 0;
    src.connect(hp); hp.connect(lp); lp.connect(rainGain); rainGain.connect(master);
    const send = AC.createGain(); send.gain.value = 0.4; rainGain.connect(send); send.connect(wetSend);
    src.start();
  }
  rainGain.gain.setTargetAtTime(on && soundOn ? 0.1 : 0, AC.currentTime, 0.6);
}
// individual drops on the window, called each frame while it rains
function rainDrops(dt) {
  if (!music.rain || !live()) return;
  if (Math.random() < dt * 14) noise(rnd(0.002, 0.006), { type: 'highpass', f0: rnd(2500, 6000), q: 0.6, vol: rnd(0.02, 0.07), attack: 0.0005, pan: rnd(-0.9, 0.9), wet: 0.6 });
  if (Math.random() < dt * 0.8) bubble(rnd(1200, 2400), rnd(0.02, 0.05), { pan: rnd(-0.8, 0.8) });
}

function ripple(x, y, size = 1, color = '255,255,255') { fx.ripples.push({ x, y, r: 6, max: 70 * size, life: 1, color }); }
function sparkle(x, y, n = 8, colors = SPARK_COLORS, speed = 1) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, sp = rnd(80, 320) * speed;
    fx.sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80, life: 1, s: rnd(3, 7),
      rot: Math.random() * TAU, vr: rnd(-6, 6), color: colors[Math.floor(Math.random() * colors.length)] });
  }
}
function confetti(x, y, n = 60) {
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + rnd(-1.2, 1.2), sp = rnd(300, 750);
    fx.sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1.6, s: rnd(4, 8), rot: Math.random() * TAU,
      vr: rnd(-10, 10), color: ROWS[Math.floor(Math.random() * ROWS.length)], rect: true });
  }
}
function floatText(x, y, text, size = 20, color = '#ffffff') { fx.texts.push({ x, y, text, size, color, life: 1 }); }
function shake(a) { fx.shake = Math.min(14, fx.shake + a); }

const combo = { n: 0, t: 0, pulse: 0 };
function comboHit(x, y) {
  combo.n = combo.t > 0 ? combo.n + 1 : 1;
  combo.t = 1;
  combo.pulse = 1;
  if (combo.n > stats.best) { stats.best = combo.n; saveStats(); }
  if (combo.n >= 25) unlock('combo25');
  if (combo.n >= 100) unlock('combo100');
  if (combo.n % 10 === 0) {
    sfx.chime(combo.n / 10);
    floatText(x, y - 30, `×${combo.n}!`, 30, '#ffe66b');
    sparkle(x, y, 18);
    shake(3);
  }
}

function updateFx(dt) {
  for (let i = fx.ripples.length - 1; i >= 0; i--) {
    const r = fx.ripples[i];
    r.life -= dt * 2.2; r.r += (r.max - r.r) * Math.min(1, dt * 8);
    if (r.life <= 0) fx.ripples.splice(i, 1);
  }
  for (let i = fx.sparks.length - 1; i >= 0; i--) {
    const p = fx.sparks[i];
    p.vy += (p.rect ? 700 : 260) * dt; p.vx *= Math.exp(-dt * (p.rect ? 1 : 2.5));
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt * 1.3;
    if (p.life <= 0 || p.y > H + 20) fx.sparks.splice(i, 1);
  }
  for (let i = fx.texts.length - 1; i >= 0; i--) {
    const t = fx.texts[i];
    t.y -= 50 * dt; t.life -= dt * 1.1;
    if (t.life <= 0) fx.texts.splice(i, 1);
  }
  combo.t = Math.max(0, combo.t - dt * 1.1);
  if (!combo.t) combo.n = 0;
  combo.pulse = Math.max(0, combo.pulse - dt * 5);
  fx.shake *= Math.exp(-dt * 10);
}
function star(x, y, s, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath();
  for (let i = 0; i < 8; i++) { const r = i % 2 ? s * 0.35 : s, a = (i / 8) * TAU; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function drawFx() {
  for (const r of fx.ripples) {
    ctx.strokeStyle = `rgba(${r.color},${r.life * 0.7})`; ctx.lineWidth = 3 * r.life;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
  }
  for (const p of fx.sparks) {
    ctx.globalAlpha = Math.min(1, p.life);
    ctx.fillStyle = p.color;
    if (p.rect) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); }
    else star(p.x, p.y, p.s * (0.5 + p.life * 0.5), p.rot);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of fx.texts) {
    ctx.globalAlpha = Math.min(1, t.life * 2);
    ctx.font = `800 ${t.size}px Ubuntu, Nunito, system-ui, sans-serif`;
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(80,50,120,.45)'; ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = t.color; ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  if (combo.n >= 3) {
    const s = 1 + combo.pulse * 0.25 + Math.min(combo.n, 100) * 0.004;
    ctx.save(); ctx.translate(W / 2, Math.min(170, H * 0.2)); ctx.scale(s, s);
    ctx.globalAlpha = Math.min(1, combo.t * 3);
    ctx.font = '800 30px Ubuntu, Nunito, system-ui, sans-serif';
    const g = ctx.createLinearGradient(-80, 0, 80, 0);
    const h = (performance.now() / 8) % 360;
    g.addColorStop(0, `hsl(${h},95%,65%)`); g.addColorStop(1, `hsl(${(h + 90) % 360},95%,65%)`);
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.strokeText(`×${combo.n} combo`, 0, 0);
    ctx.fillStyle = g; ctx.fillText(`×${combo.n} combo`, 0, 0);
    ctx.restore();
  }
  ctx.textBaseline = 'alphabetic';
}

// ---------- living background ----------
const THEMES = {
  NeeDoh: ['#fde8f1', '#e6e9ff'], 'Pop It': ['#fff1e2', '#e2f0ff'], Butter: ['#fff6da', '#ffe8d8'],
  Dumpling: ['#e6f6ef', '#f7eee2'], Orbeez: ['#efe4ff', '#dcf4ff'], 'Bubble Wrap': ['#e2f2ff', '#efeaff'],
  Slime: ['#e2fbf2', '#e6e4ff'], 'Kinetic Sand': ['#fff0e4', '#f1e4ff'], Spinner: ['#e6eaff', '#f6e4ff'], 'Click Board': ['#eef0f8', '#f8eaf2'],
};
const NIGHT = ['#26205a', '#0b0e24'];
const bg = { a: hexRgb('#fde8f1'), b: hexRgb('#e6e9ff'), night: 0, nightOn: false };
const orbs = Array.from({ length: 16 }, () => ({ x: Math.random(), y: Math.random(), r: rnd(30, 110), sp: rnd(0.005, 0.02),
  ph: Math.random() * TAU, depth: rnd(0.2, 1), hue: Math.floor(rnd(0, 360)) }));
const stars = Array.from({ length: 110 }, () => ({ x: Math.random(), y: Math.random() * 0.85, s: rnd(0.5, 1.8), ph: Math.random() * TAU }));
const drops = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random(), sp: rnd(0.6, 1.2), len: rnd(10, 26) }));
const lerpRgb = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
const rgbStr = (c, a = 1) => `rgba(${c.map(Math.round).join(',')},${a})`;
function drawBackground(t, dt) {
  const th = THEMES[toy.name] || THEMES.NeeDoh;
  const k = Math.min(1, dt * 3);
  bg.a = lerpRgb(bg.a, hexRgb(th[0]), k); bg.b = lerpRgb(bg.b, hexRgb(th[1]), k);
  bg.night += ((bg.nightOn ? 1 : 0) - bg.night) * Math.min(1, dt * 2.5);
  const n = bg.night;
  const c1 = lerpRgb(bg.a, hexRgb(NIGHT[0]), n), c2 = lerpRgb(bg.b, hexRgb(NIGHT[1]), n);
  const g = ctx.createRadialGradient(W * 0.3, H * 0.2, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.9);
  g.addColorStop(0, rgbStr(c1)); g.addColorStop(1, rgbStr(c2));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  if (n > 0.02) {
    for (const s of stars) {
      ctx.globalAlpha = n * (0.35 + 0.65 * Math.abs(Math.sin(t * 0.8 + s.ph)));
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.s, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // drifting bokeh, with a little parallax toward the pointer
  const px = W ? (pointer.x / W - 0.5) : 0, py = H ? (pointer.y / H - 0.5) : 0;
  for (const o of orbs) {
    o.y -= o.sp * dt * 0.5;
    if (o.y < -0.2) { o.y = 1.2; o.x = Math.random(); }
    const x = o.x * W + Math.sin(t * 0.3 + o.ph) * 30 - px * 40 * o.depth, y = o.y * H - py * 30 * o.depth;
    const r = o.r * (0.7 + o.depth * 0.5);
    const gr = ctx.createRadialGradient(x, y, 0, x, y, r);
    const col = n > 0.5 ? `hsla(${(o.hue + t * 6) % 360},90%,70%,` : 'rgba(255,255,255,';
    gr.addColorStop(0, col + (0.28 * o.depth * (n > 0.5 ? 0.55 : 1)) + ')'); gr.addColorStop(1, col + '0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  }
  if (music.rain) {
    ctx.strokeStyle = n > 0.5 ? 'rgba(190,200,255,.25)' : 'rgba(110,130,190,.22)'; ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (const d of drops) {
      d.y += d.sp * dt * 1.4; if (d.y > 1.05) { d.y = -0.05; d.x = Math.random(); }
      const x = d.x * W, y = d.y * H;
      ctx.moveTo(x, y); ctx.lineTo(x - d.len * 0.25, y + d.len);
    }
    ctx.stroke();
  }
}

// ---------- soft body ----------
const N = 48;
class SoftBody {
  // o: { shape(angle, r) -> {x,y}, k, damp, smooth, sqx, sqy, pull, sigma, homeY }
  constructor(o) {
    this.o = o;
    this.p = []; this.rest = [];
    this.hx = 0; this.hy = 0; this.r = 100;
    this.squeeze = 0;
    for (let i = 0; i < N; i++) this.p.push({ x: 0, y: 0, vx: 0, vy: 0, grab: 0 });
  }
  setHome(x, y, r, reset) {
    const first = this.rest.length === 0 || reset;
    this.hx = x; this.hy = y + (this.o.homeY || 0) * r; this.r = r;
    const pts = [];
    for (let i = 0; i < N; i++) pts.push(this.o.shape((i / N) * TAU, r));
    // center the rest shape on its centroid so shape matching doesn't drift
    let cx = 0, cy = 0;
    for (const q of pts) { cx += q.x; cy += q.y; }
    cx /= N; cy /= N;
    this.rest = pts.map(q => ({ x: q.x - cx, y: q.y - cy }));
    if (first) this.rest.forEach((q, i) => { this.p[i].x = this.hx + q.x; this.p[i].y = this.hy + q.y; this.p[i].vx = this.p[i].vy = 0; });
  }
  centroid() {
    let x = 0, y = 0;
    for (const q of this.p) { x += q.x; y += q.y; }
    return { x: x / N, y: y / N };
  }
  contains(x, y) {
    let inside = false;
    for (let i = 0, j = N - 1; i < N; j = i++) {
      const a = this.p[i], b = this.p[j];
      if ((a.y > y) !== (b.y > y) && x < (b.x - a.x) * (y - a.y) / (b.y - a.y) + a.x) inside = !inside;
    }
    return inside;
  }
  grab(x, y) {
    const sigma = this.r * this.o.sigma;
    for (const q of this.p) {
      const d2 = (q.x - x) ** 2 + (q.y - y) ** 2;
      q.grab = Math.exp(-d2 / (2 * sigma * sigma));
      if (q.grab < 0.04) q.grab = 0;
      q.gx = q.x; q.gy = q.y;
    }
  }
  release() { for (const q of this.p) q.grab = 0; }
  step(dt) {
    const o = this.o, c = this.centroid();
    const sx = 1 + this.squeeze * o.sqx, sy = 1 - this.squeeze * o.sqy;
    const hx = (this.hx - c.x) * 6, hy = (this.hy - c.y) * 6;
    const damp = Math.exp(-o.damp * dt);
    for (let i = 0; i < N; i++) {
      const q = this.p[i], r = this.rest[i];
      const ia = (i + N - 1) % N, ib = (i + 1) % N;
      let fx = (c.x + r.x * sx - q.x) * o.k + hx;
      let fy = (c.y + r.y * sy - q.y) * o.k + hy;
      // smoothing relative to the rest shape, so corners (butter) survive
      const a = this.p[ia], b = this.p[ib], ra = this.rest[ia], rb = this.rest[ib];
      fx += ((a.x + b.x) / 2 - q.x - ((ra.x + rb.x) / 2 - r.x) * sx) * o.smooth;
      fy += ((a.y + b.y) / 2 - q.y - ((ra.y + rb.y) / 2 - r.y) * sy) * o.smooth;
      if (q.grab) {
        fx += (q.gx + drag.dx * q.grab - q.x) * 420 * q.grab;
        fy += (q.gy + drag.dy * q.grab - q.y) * 420 * q.grab;
      }
      q.vx = (q.vx + fx * dt) * damp; q.vy = (q.vy + fy * dt) * damp;
    }
    for (const q of this.p) { q.x += q.vx * dt; q.y += q.vy * dt; }
  }
  energy() { let e = 0; for (const q of this.p) e += Math.hypot(q.vx, q.vy); return e / N; }
  stretch() {
    const c = this.centroid();
    let d = 0, mx = 0;
    for (const q of this.p) { const l = Math.hypot(q.x - c.x, q.y - c.y); d += l; mx = Math.max(mx, l); }
    return mx / (d / N) - 1;
  }
  path() {
    const P = this.p;
    ctx.beginPath();
    ctx.moveTo((P[N - 1].x + P[0].x) / 2, (P[N - 1].y + P[0].y) / 2);
    for (let i = 0; i < N; i++) {
      const a = P[i], b = P[(i + 1) % N];
      ctx.quadraticCurveTo(a.x, a.y, (a.x + b.x) / 2, (a.y + b.y) / 2);
    }
    ctx.closePath();
  }
  bounds() {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const q of this.p) { x0 = Math.min(x0, q.x); y0 = Math.min(y0, q.y); x1 = Math.max(x1, q.x); y1 = Math.max(y1, q.y); }
    return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 };
  }
  // a point inside the body that follows the deformation: seg = boundary index, f = 0 center .. 1 edge
  map(seg, f, c) {
    seg = ((seg % N) + N) % N;
    const i = Math.floor(seg), fr = seg - i;
    const a = this.p[i], b = this.p[(i + 1) % N];
    const ex = a.x + (b.x - a.x) * fr, ey = a.y + (b.y - a.y) * fr;
    return { x: c.x + (ex - c.x) * f, y: c.y + (ey - c.y) * f };
  }
  shadow(bb, c, alpha = 0.16) {
    ctx.save();
    ctx.fillStyle = `rgba(90,60,130,${alpha})`;
    ctx.filter = 'blur(14px)';
    ctx.beginPath();
    ctx.ellipse(c.x, bb.y1 + this.r * 0.05, bb.w * 0.46, this.r * 0.12, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
}

// Shared press/drag/release plumbing for the squishy toys
function softToy(def) {
  const body = new SoftBody(def.body);
  const toy = {
    ...def, body, soft: true,
    resize(reset) { body.setHome(W / 2, H / 2 + 20, baseRadius() * (def.scale || 1), reset); },
    down(x, y) {
      if (!body.contains(x, y)) return false;
      drag.active = true; drag.sx = x; drag.sy = y; drag.dx = drag.dy = 0; drag.t = performance.now();
      body.grab(x, y);
      def.onPress && def.onPress.call(toy, x, y);
      ripple(x, y, 1.2);
      buzz(12); addSquish();
      return true;
    },
    move(x, y) {
      if (!drag.active) return;
      // rubbery resistance: the further you pull, the harder it gets
      const rx = x - drag.sx, ry = y - drag.sy;
      const d = Math.hypot(rx, ry), max = body.r * def.body.pull;
      const k = d > 0 ? max * Math.tanh(d / max) / d : 0;
      drag.dx = rx * k; drag.dy = ry * k;
      def.onDrag && def.onDrag.call(toy, x, y);
    },
    up() {
      if (!drag.active) return;
      drag.active = false;
      body.release();
      buzz(8);
      const pulled = Math.hypot(drag.dx, drag.dy) / body.r;
      if (pulled > 0.5) { shake(pulled * 4); sparkle(pointer.x, pointer.y, Math.round(pulled * 10)); }
      if (pulled > 1.3 && toy.name === 'NeeDoh') unlock('stretch');
      def.onRelease && def.onRelease.call(toy, pulled);
    },
    update(dt, t, now) {
      const target = drag.active ? clamp((now - drag.t) / def.squeezeIn, 0, 1) : 0;
      const rate = drag.active ? 1000 / def.squeezeIn * 2.4 : def.squeezeOut;
      body.squeeze += (target - body.squeeze) * Math.min(1, dt * rate);
      for (let i = 0; i < 6; i++) body.step(dt / 6);
      def.onUpdate && def.onUpdate.call(toy, dt, t);
      squishAudio(def.sound, body.energy(), body.stretch(), body.squeeze, dt, drag.active);
    },
    popIn() {
      body.p.forEach((q, i) => {
        const r = body.rest[i];
        q.x = body.hx + r.x * 0.3; q.y = body.hy + r.y * 0.3; q.vx = r.x * 3; q.vy = r.y * 3 - 200;
      });
    },
    poke() {
      for (const q of body.p) q.vy += (q.y < body.hy ? 1 : -1) * 260 + (Math.random() - .5) * 60;
      def.onPress && def.onPress.call(toy, body.hx, body.hy);
      setTimeout(() => def.onRelease && def.onRelease.call(toy, 0.3), 120);
      addSquish();
    },
  };
  return toy;
}

const parts = [];
function spawnDroplets(c, r, amount, color) {

const needoh = softToy({
  name: 'NeeDoh', emoji: '🫧', title: 'NeeDoh Squish',
  sub: 'click & hold to squeeze · drag to stretch · let go to plop',
  body: { shape: (a, r) => ({ x: Math.cos(a) * r, y: Math.sin(a) * r }),
    k: 90, damp: 5.5, smooth: 140, sqx: 0.28, sqy: 0.22, pull: 1.6, sigma: 0.55, homeY: -0.15 },
  squeezeIn: 600, squeezeOut: 9,
  sound: { bed: 0.8, lp: [500, 1500], bp: [220, 650], grains: 30, bf: [420, 1200], bvol: 0.18 },
  crackleAcc: 0,
  onPress() { sfx.grab(); },
  onRelease(pulled) {
    sfx.plop(pulled > 0.6);
    spawnDroplets(this.body.centroid(), this.body.r, pulled, skinNow.a);
  },
  onUpdate(dt, t) {
    const b = this.body;
    if (!drag.active) {
      const br = Math.sin(t * 1.3) * 0.6;
      for (let i = 0; i < N; i++) b.p[i].vy += Math.sin(i / N * TAU + t) * br * dt * 8;
    } else if (AC && soundOn) {
      this.crackleAcc += dt * (3 + b.energy() * 0.08) * (texture === 2 ? 0.3 : 1);
      while (this.crackleAcc > 1) { this.crackleAcc -= 1; texture === 1 ? sfx.sugar() : sfx.crackle(); }
    }
  },
  draw(t) {
    const b = this.body, c = b.centroid(), bb = b.bounds();
    b.shadow(bb, c);
    if (skin.fx === 'holo') {
      const h = (t * 45) % 360;
      skinNow = { a: `hsl(${h},95%,76%)`, b: `hsl(${(h + 70) % 360},85%,62%)`, glow: `hsl(${(h + 160) % 360},100%,94%)` };
    } else skinNow = skin;
    const g = ctx.createRadialGradient(c.x - bb.w * 0.18, c.y - bb.h * 0.22, b.r * 0.1, c.x, c.y, Math.max(bb.w, bb.h) * 0.62);
    g.addColorStop(0, skinNow.glow); g.addColorStop(0.45, skinNow.a); g.addColorStop(1, skinNow.b);
    b.path(); ctx.fillStyle = g; ctx.fill();
    if (skin.fx) {

      wh.rg.gain.setTargetAtTime(soundOn ? Math.min(0.025, rps * 0.0018) : 0, t, 0.05);
    }
  },
  body(ang, alpha) {
    const { R, cx, cy } = this, st = SPINNER_STYLES[this.style], t = performance.now() / 1000;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang); ctx.globalAlpha = alpha;
    const lobeR = R * 0.36, lobeD = R * 0.62;
    // arms
    ctx.lineCap = 'round'; ctx.lineWidth = R * 0.42;

    ctx.strokeStyle = armCol;
    ctx.beginPath();
    for (let i = 0; i < 3; i++) { const a = i * TAU / 3; ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * lobeD, Math.sin(a) * lobeD); }
    ctx.stroke();
    for (let i = 0; i < 3; i++) {
      const a = i * TAU / 3, x = Math.cos(a) * lobeD, y = Math.sin(a) * lobeD;
      let c1, c2;
      if (st === 'Rainbow') { const h = (i * 120 + t * 20) % 360; c1 = `hsl(${h},90%,72%)`; c2 = `hsl(${(h + 40) % 360},85%,52%)`; }

      g.addColorStop(0, c1); g.addColorStop(1, c2);

      const br = lobeR * 0.55;
      const sg = ctx.createRadialGradient(x - br * 0.3, y - br * 0.3, 0, x, y, br);
      sg.addColorStop(0, '#ffffff'); sg.addColorStop(1, '#8d94a8');
      ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(x, y, br, 0, TAU); ctx.fill();
      ctx.fillStyle = '#c9cede';
      for (let k = 0; k < 7; k++) { const b = k * TAU / 7; ctx.beginPath(); ctx.arc(x + Math.cos(b) * br * 0.65, y + Math.sin(b) * br * 0.65, br * 0.17, 0, TAU); ctx.fill(); }
      ctx.fillStyle = '#5d6478'; ctx.beginPath(); ctx.arc(x, y, br * 0.38, 0, TAU); ctx.fill();
      if (st === 'Neon') { // glowing LED on each lobe
        ctx.shadowColor = ['#ff4fd8', '#4ff3ff', '#b6ff4f'][i]; ctx.shadowBlur = 18;
        ctx.fillStyle = ctx.shadowColor; ctx.beginPath(); ctx.arc(x, y, lobeR * 0.14, 0, TAU); ctx.fill();
        ctx.shadowBlur = 0;
      }
    }
    ctx.restore();
  },
  draw() {
    const { R, cx, cy } = this, st = SPINNER_STYLES[this.style], rps = Math.abs(this.w) / TAU;
    ctx.save();
    ctx.fillStyle = 'rgba(90,60,130,.18)'; ctx.filter = 'blur(16px)';
    ctx.beginPath(); ctx.ellipse(cx, cy + R * 1.1, R * 0.9, R * 0.14, 0, 0, TAU); ctx.fill();
    ctx.restore();
    // light trails when it's really going
    if (rps > 1.5) {
      const cols = st === 'Neon' ? ['#ff4fd8', '#4ff3ff', '#b6ff4f'] : st === 'Gold' ? ['#ffe28a', '#ffe28a', '#ffe28a'] : ['#ff8fcf', '#8fd8ff', '#ffe68f'];
      ctx.lineCap = 'round';
      this.trails.forEach((tr, i) => {
        for (let k = 1; k < tr.length; k++) {
          ctx.strokeStyle = cols[i]; ctx.globalAlpha = (k / tr.length) * Math.min(0.6, rps / 12);
          ctx.lineWidth = R * 0.08 * (k / tr.length);
          ctx.beginPath(); ctx.moveTo(tr[k - 1][0], tr[k - 1][1]); ctx.lineTo(tr[k][0], tr[k][1]); ctx.stroke();
        }
      });
      ctx.globalAlpha = 1;
    }
    // motion blur: ghost copies along the spin
    const ghosts = Math.min(6, Math.floor(Math.abs(this.w) / 12));
    for (let k = ghosts; k >= 1; k--) this.body(this.ang - this.w * 0.006 * k, 0.12);
    this.body(this.ang, ghosts ? 0.7 : 1);
    // center cap stays still
    const cg = ctx.createRadialGradient(cx - R * 0.07, cy - R * 0.08, 0, cx, cy, R * 0.2);
    cg.addColorStop(0, '#ffffff'); cg.addColorStop(1, st === 'Gold' ? '#d9a93a' : '#b8bfd6');
    ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(cx, cy, R * 0.2, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2; ctx.stroke();
    // speedometer
    if (rps > 0.3) {
      ctx.globalAlpha = Math.min(1, rps / 2);
      ctx.font = '700 18px Ubuntu, Nunito, system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.fillStyle = bg.night > 0.5 ? '#ece6ff' : '#5b4a6b';
      ctx.fillText(`${Math.round(rps * 60).toLocaleString()} RPM`, cx, cy + R * 1.45);
      ctx.globalAlpha = 1;
    }
  },
};

// ---------- toy: click board ----------
const board = {
  name: 'Click Board', emoji: '⌨️', title: 'Click Board',
  sub: 'thocky keys · toggle switches · a big button · a dial and a slider',
  soft: false, els: [], ptrs: new Map(), presses: 0,
  resize() {
    let bw = Math.min(W * 0.92, 640), bh = bw * 0.82;

    const old = this.els, X = f => -bw / 2 + f * bw, Y = f => -bh / 2 + f * bh;
    const els = [];
    const labels = ['A', 'S', 'M', 'R', 'C', 'A', 'L', 'M', 'Z', 'E', 'N', '♡'], rowCols = ['#ffd3e8', '#dcd2ff', '#c9f2e3'];
    const cw = bw * 0.9 / 4, ch = bh * 0.47 / 3, ks = Math.min(cw, ch) * 0.86;
    for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++)
      els.push({ type: 'key', x: X(0.05) + cw * (c + 0.5), y: Y(0.05) + ch * (r + 0.5), s: ks, label: labels[r * 4 + c], color: rowCols[r], clicky: r === 0, down: 0, dy: 0 });
    const m = Math.min(bw, bh);
    els.push({ type: 'toggle', x: X(0.1), y: Y(0.7), w: m * 0.075, h: m * 0.2, on: false, a: 0 });
    els.push({ type: 'toggle', x: X(0.27), y: Y(0.7), w: m * 0.075, h: m * 0.2, on: true, a: 1 });
    els.push({ type: 'arcade', x: X(0.5), y: Y(0.7), r: m * 0.11, down: 0, glow: 0 });
    els.push({ type: 'dial', x: X(0.79), y: Y(0.7), r: m * 0.1, ang: 0, det: 0 });
    els.push({ type: 'slider', x0: X(0.1), x1: X(0.9), y: Y(0.905), v: 0.3, notch: 4, r: m * 0.045 });
    // keep switch/dial/slider positions across resizes
    if (old.length === els.length) old.forEach((o, i) => { for (const k of ['on', 'a', 'ang', 'v', 'notch']) if (k in o) els[i][k] = o[k]; });
    this.els = els;
  },
  pan(x) { return clamp(((this.cx + x) / W) * 2 - 1, -1, 1) * 0.8; },
  find(lx, ly) {
    for (const e of this.els) {
      if (e.type === 'key' && Math.abs(lx - e.x) < e.s / 2 && Math.abs(ly - e.y) < e.s / 2) return e;
      if (e.type === 'toggle' && Math.abs(lx - e.x) < e.w && Math.abs(ly - e.y) < e.h / 2 + 6) return e;
      if ((e.type === 'arcade' || e.type === 'dial') && Math.hypot(lx - e.x, ly - e.y) < e.r * 1.2) return e;
      if (e.type === 'slider' && lx > e.x0 - e.r && lx < e.x1 + e.r && Math.abs(ly - e.y) < e.r * 1.6) return e;
    }
    return null;
  },
  press(e, x, y) {

    if (e.type === 'key') { e.down = 1; sfx.keyDown(e.clicky, pan); comboHit(this.cx + e.x, this.cy + e.y); }
    else if (e.type === 'toggle') { e.on = !e.on; sfx.toggle(e.on, pan); if (e.on) sparkle(this.cx + e.x, this.cy + e.y - e.h * 0.6, 5, ['#9dff8a', '#ffffff']); }
    else if (e.type === 'arcade') { e.down = 1; e.glow = 1; sfx.arcadeDown(pan); shake(2); ripple(this.cx + e.x, this.cy + e.y, 1, '255,120,170'); }
    else return;
    this.presses++; addSquish(); buzz(8);

  },
  release(e) {
    if (e.type === 'key' && e.down) { e.down = 0; sfx.keyUp(e.clicky, this.pan(e.x)); }
    if (e.type === 'arcade' && e.down) { e.down = 0; sfx.arcadeUp(this.pan(e.x)); }
  },
  down(x, y, id) {
    const lx = x - this.cx, ly = y - this.cy;
    if (Math.abs(lx) > this.bw / 2 || Math.abs(ly) > this.bh / 2) return false;
    const e = this.find(lx, ly);
    if (!e) return true;
    this.ptrs.set(id, { e, a: Math.atan2(ly - (e.y || 0), lx - (e.x || 0)) });

  },
  move(x, y, id) {
    const p = this.ptrs.get(id);

    const e = p.e;
    if (e.type === 'dial') {

    } else if (e.type === 'slider') {

  },
  up(id) {
    if (id === undefined) { for (const p of this.ptrs.values()) this.release(p.e); this.ptrs.clear(); return; }
    const p = this.ptrs.get(id);
    if (p) { this.release(p.e); this.ptrs.delete(id); }
  },
  poke() { const keys = this.els.filter(e => e.type === 'key'); const k = keys[Math.floor(Math.random() * keys.length)]; this.press(k); setTimeout(() => this.release(k), 120); },
  update(dt) {
    silenceBed();
    for (const e of this.els) {
      if (e.type === 'key') e.dy += ((e.down ? 1 : 0) - e.dy) * Math.min(1, dt * 30);
      if (e.type === 'toggle') e.a += ((e.on ? 1 : 0) - e.a) * Math.min(1, dt * 25);

  },
  draw() {
    const { bw, bh } = this;

    ctx.fillStyle = 'rgba(70,50,110,.2)'; ctx.filter = 'blur(18px)';
    ctx.fillRect(-bw / 2 + 8, -bh / 2 + 18, bw, bh);

    ctx.fillStyle = '#c9c3dc'; ctx.beginPath(); ctx.roundRect(-bw / 2, -bh / 2 + 8, bw, bh, 26); ctx.fill();
    const bg2 = ctx.createLinearGradient(0, -bh / 2, 0, bh / 2);
    bg2.addColorStop(0, '#ffffff'); bg2.addColorStop(1, '#ebe7f6');
    ctx.fillStyle = bg2; ctx.beginPath(); ctx.roundRect(-bw / 2, -bh / 2, bw, bh, 26); ctx.fill();
    ctx.strokeStyle = 'rgba(160,150,200,.25)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(-bw / 2 + bw * 0.03, -bh / 2 + bh * 0.03, bw * 0.94, bh * 0.52, 16); ctx.stroke();

  draw_key(e) {

    ctx.fillStyle = mix(e.color, '#5a4a7a', 0.28);

    ctx.beginPath(); ctx.roundRect(e.x - top / 2, e.y - top / 2 - s * 0.07 + d, top, top, rad * 0.8); ctx.fill();
    ctx.fillStyle = 'rgba(70,50,110,.75)'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  },
  draw_toggle(e) {
    const { x, y, w, h } = e;
    ctx.fillStyle = '#d9d4ea'; ctx.beginPath(); ctx.roundRect(x - w, y - h / 2, w * 2, h, w * 0.5); ctx.fill();
    ctx.fillStyle = '#4b4266'; ctx.beginPath(); ctx.roundRect(x - w * 0.3, y - h * 0.32, w * 0.6, h * 0.64, w * 0.3); ctx.fill();
    // lever
    const ly = y + (0.5 - e.a) * h * 0.5;
    ctx.strokeStyle = '#b8bccb'; ctx.lineWidth = w * 0.35; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, ly); ctx.stroke();

  draw_arcade(e) {

    ctx.fillStyle = '#c23d7e'; ctx.beginPath(); ctx.arc(x, y + r * 0.1, r * 0.92, 0, TAU); ctx.fill();
    const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.35 + d, r * 0.05, x, y + d, r * 0.9);
    g.addColorStop(0, e.down ? '#ff8fc0' : '#ffb3d6'); g.addColorStop(1, e.down ? '#c8326f' : '#ec4f93');

    for (let i = -1; i <= 1; i++) ctx.fillRect(kx + i * r * 0.3 - 1, y - r * 0.5, 2, r);

// ---------- toy switching ----------
const TOYS = [needoh, popit, butter, dumpling, orbeez, wrap, slime, sand, spinner, board];
const OPTS = new Map([[needoh, 'opt-needoh'], [popit, 'opt-popit'], [butter, 'opt-butter'], [orbeez, 'opt-orbeez'], [wrap, 'opt-wrap'],
  [slime, 'opt-slime'], [sand, 'opt-sand'], [spinner, 'opt-spinner']]);
let toy = needoh;
const titleEl = document.getElementById('title'), subEl = document.getElementById('sub');
const toysEl = document.getElementById('toys');
TOYS.forEach(t => {
  const b = document.createElement('button');
  b.innerHTML = `<span class="e">${t.emoji}</span><span class="nm"></span>`;
  b.querySelector('.nm').textContent = t.name;
  b.title = t.name;
  b.onclick = () => { initAudio(); selectToy(t, true); };
  t.tab = b;
  toysEl.appendChild(b);
});
let introT = 9;
function selectToy(t, announce) {
  if (toy.up) toy.up();
  if (toy.leave) toy.leave();
  drag.active = false;
  toy = t;
  TOYS.forEach(x => x.tab.classList.toggle('on', x === t));
  t.tab.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  titleEl.textContent = t.title; subEl.textContent = t.sub;
  document.querySelectorAll('[id^="opt-"]').forEach(el => { el.hidden = el.id !== OPTS.get(t); });
  cv.classList.remove('grabbing', 'poke');
  t.resize(true);
  silenceBed();
  // spring into view
  introT = 0;
  if (t.popIn) t.popIn();
  if (announce) { sfx.appear(); sparkle(W / 2, H / 2 + 20, 14); }
  safeSet('needoh-toy', t.name);
  if (!stats.tried.includes(t.name)) { stats.tried.push(t.name); saveStats(); }
  if (TOYS.every(x => stats.tried.includes(x.name))) unlock('all');
}

// ---------- input ----------
cv.addEventListener('pointerdown', e => {
  initAudio(); hideHint();
  pointer.x = e.clientX; pointer.y = e.clientY;
  if (toy.soft && drag.active) return; // squishies take one hand at a time
  if (toy.down(e.clientX, e.clientY, e.pointerId)) {
    if (toy.soft) { cv.classList.add('grabbing'); drag.id = e.pointerId; }
    cv.setPointerCapture(e.pointerId);
  } else ripple(e.clientX, e.clientY, 0.4);
});
cv.addEventListener('pointermove', e => {
  if (!toy.soft || !drag.active || e.pointerId === drag.id) { pointer.x = e.clientX; pointer.y = e.clientY; }
  if (!toy.soft || !drag.active || e.pointerId === drag.id) toy.move(e.clientX, e.clientY, e.pointerId);
});
const endPointer = e => {
  if (toy.soft && drag.active && e.pointerId !== drag.id) return;
  toy.up(e.pointerId); cv.classList.remove('grabbing');
};
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('button') && e.code === 'Space') return;
  if (e.code === 'Space') { e.preventDefault(); initAudio(); hideHint(); toy.poke(); }
  if (e.code === 'Escape') panel.hidden = true;
  if (e.code === 'KeyM') musicBtn.click();
  if (e.code === 'KeyR') rainBtn.click();
  if (e.code === 'KeyN') nightBtn.click();
  const i = ['Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5', 'Digit6', 'Digit7', 'Digit8', 'Digit9', 'Digit0'].indexOf(e.code);
  if (i >= 0) { initAudio(); selectToy(TOYS[i], true); }
});
const hint = document.getElementById('hint');
function hideHint() { hint.style.opacity = 0; }

// ---------- UI ----------
const swEl = document.getElementById('swatches');
SKINS.forEach((s, i) => {
  const b = document.createElement('div');
  b.className = 'swatch' + (i === 0 ? ' on' : '');
  b.title = s.name;
  b.style.background = s.swatch || `radial-gradient(circle at 35% 30%, ${s.glow}, ${s.a} 50%, ${s.b})`;
  b.onclick = () => {
    skin = s;
    if (s.fx) unlock('shiny');
    sparkle(needoh.body.hx, needoh.body.hy, 10);
    swEl.querySelectorAll('.swatch').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    initAudio(); sfx.plop();
    for (const q of needoh.body.p) { q.vx += (Math.random() - .5) * 200; q.vy += (Math.random() - .5) * 200; }
  };
  swEl.appendChild(b);
});
const texBtn = document.getElementById('texBtn');
texBtn.onclick = () => {
  texture = (texture + 1) % TEXTURES.length;
  texBtn.textContent = TEXTURES[texture];
  texBtn.classList.toggle('on', texture !== 2);
};
document.getElementById('flipBtn').onclick = () => { initAudio(); popit.doFlip(); };
const shapeBtn = document.getElementById('shapeBtn');
shapeBtn.onclick = () => {
  popit.shape = (popit.shape + 1) % SHAPES.length;
  shapeBtn.textContent = SHAPES[popit.shape];
  popit.bubbles = []; popit.build();
  initAudio(); sfx.flip();
};
const sndBtn = document.getElementById('sndBtn');
sndBtn.onclick = () => {
  soundOn = !soundOn; initAudio();
  sndBtn.textContent = soundOn ? '🔊' : '🔇';
  sndBtn.classList.toggle('on', soundOn);
  if (!soundOn) silenceBed();
  master.gain.setTargetAtTime(soundOn ? 1 : 0, AC.currentTime, 0.05); // also hushes music & rain
};
const musicBtn = document.getElementById('musicBtn');
musicBtn.onclick = () => {
  setMusic(!music.on);
  musicBtn.classList.toggle('on', music.on);
  if (music.on) unlock('chill');
};
const rainBtn = document.getElementById('rainBtn');
rainBtn.onclick = () => { setRain(!music.rain); rainBtn.classList.toggle('on', music.rain); };
const nightBtn = document.getElementById('nightBtn');
function setNight(on) {
  bg.nightOn = on;
  document.body.classList.toggle('night', on);
  nightBtn.classList.toggle('on', on);
  nightBtn.textContent = on ? '☀️' : '🌙';
  safeSet('needoh-night', on ? '1' : '');
  if (on) unlock('night');
}
nightBtn.onclick = () => setNight(!bg.nightOn);
document.getElementById('shakeBtn').onclick = () => { initAudio(); orbeez.poke(); };
const orbColBtn = document.getElementById('orbColBtn');
orbColBtn.onclick = () => {
  const names = Object.keys(ORB_PALETTES);
  orbeez.palette = names[(names.indexOf(orbeez.palette) + 1) % names.length];
  orbColBtn.textContent = orbeez.palette;
  const pal = ORB_PALETTES[orbeez.palette];
  orbeez.sprites = {};
  orbeez.balls.forEach((b, i) => { b.color = pal[i % pal.length]; });
  initAudio(); orbeez.poke();
};
document.getElementById('sheetBtn').onclick = () => { initAudio(); wrap.newSheet(); };
const cycleBtn = (id, list, get, set) => {
  const btn = document.getElementById(id);
  btn.onclick = () => { initAudio(); const next = list[(list.indexOf(get()) + 1) % list.length]; set(next); btn.textContent = next.name || next; };
};
cycleBtn('slimeColBtn', SLIMES, () => slimeSkin, v => { slimeSkin = v; sfx.slimeLet(); for (const q of slime.body.p) q.vy += rnd(-160, 160); });
cycleBtn('sandColBtn', SANDS, () => sand.color, v => { sand.color = v; sfx.sandCut(2); });
cycleBtn('spinStyleBtn', SPINNER_STYLES, () => SPINNER_STYLES[spinner.style], v => { spinner.style = SPINNER_STYLES.indexOf(v); sfx.tap(); });
document.getElementById('newBlockBtn').onclick = () => { initAudio(); sand.newBlock(false); };
const honeyBtn = document.getElementById('honeyBtn');
honeyBtn.onclick = () => {
  honey.on = !honey.on;
  honeyBtn.classList.toggle('on', honey.on);
  honeyBtn.textContent = honey.on ? '🍯 Pouring' : '🍯 Honey';
  subEl.textContent = honey.on ? 'press and drag to drizzle honey · tap 🍯 again to squish' : butter.sub;
  initAudio(); sfx.gloop();
};
document.getElementById('cleanBtn').onclick = () => {
  honey.coat.fill(0); honey.drips = []; honey.puddles = []; honey.stream = []; honey.cracks = [];
  initAudio(); noise(0.35, { type: 'bandpass', f0: 900, f1: 2200, q: 0.8, vol: 0.25, attack: 0.05 });
  sparkle(butter.body.hx, butter.body.hy, 12, ['#ffffff', '#cfe8ff']);
};
for (const [id, get, set, key] of [['butterColIn', () => butterCol, v => { butterCol = v; }, 'needoh-butter-col'],
                                  ['honeyColIn', () => honeyCol, v => { honeyCol = v; }, 'needoh-honey-col']]) {
  const input = document.getElementById(id), label = input.parentElement;
  input.value = get(); label.style.background = get();
  input.oninput = () => { set(input.value); label.style.background = input.value; safeSet(key, input.value); };
}

// ---------- loop ----------
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  TOYS.forEach(t => t.resize(false));
}
resize();
TOYS.forEach(t => t.resize(true));
addEventListener('resize', resize);
updateCount(); updateTrophy();
if (safeGet('needoh-night')) setNight(true);
const wanted = new URLSearchParams(location.search).get('toy') || safeGet('needoh-toy');
selectToy(TOYS.find(t => t.name.toLowerCase() === (wanted || '').toLowerCase()) || needoh);

let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - lastT) / 1000); lastT = now;
  const t = now / 1000;
  toy.update(dt, t, now);
  updateFx(dt);
  rainDrops(dt);
  introT += dt;

  drawBackground(t, dt);
  ctx.save();
  if (fx.shake > 0.3) ctx.translate(rnd(-1, 1) * fx.shake, rnd(-1, 1) * fx.shake);
  if (!toy.soft && introT < 1.5) { // board toys bounce into view
    const k = 1 - 0.7 * Math.exp(-7 * introT) * Math.cos(14 * introT), ox = W / 2, oy = H / 2 + 30;
    ctx.translate(ox, oy); ctx.scale(k, k); ctx.translate(-ox, -oy);
  }
  toy.draw(t);
  ctx.restore();

  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.vy += 300 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 1.4;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    ctx.beginPath(); ctx.arc(p.x - p.r * .3, p.y - p.r * .3, p.r * .35 * p.life, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
  drawFx();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
